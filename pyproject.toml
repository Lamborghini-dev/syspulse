[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syspulse"
version = "0.1.0"
description = "Cross-platform and Windows system telemetry, event log, and diagnostic CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
syspulse = "syspulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
